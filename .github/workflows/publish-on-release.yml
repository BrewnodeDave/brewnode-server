# =============================================================================
# NPM Publish on GitHub Release Workflow
# =============================================================================
# Purpose: Automatically publishes the package to npm when a GitHub Release
#          is manually published. This is the PRIMARY publishing workflow.
#
# Triggers:
#   - When you publish a GitHub Release (not just create a draft)
#   - Only for tags starting with 'v' (e.g., v2.4.0)
#
# How to use:
#   1. The 'release.yml' workflow creates a GitHub Release automatically
#   2. Go to GitHub Releases page and click "Publish release"
#   3. This workflow triggers and publishes to npm
#
# Requirements:
#   - User must have publish rights to @brewnode/server on npm
#   - Package must be configured for npm trusted publishing (provenance)
#   - Workflow uses OIDC authentication to bypass 2FA/OTP requirements
#   - Note: npm trusted publishing is configured automatically when using
#     --provenance flag with proper OIDC permissions (id-token: write)
#
# Safety: Manual control - you must click "Publish" to trigger npm publish
# =============================================================================

on:
  release:
    types: [published]  # Only when release is published, not created as draft

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # Required for npm provenance/OIDC authentication

    # Safety guard: Only run for version tags (v1.0.0, v2.4.0, etc.)
    if: startsWith(github.event.release.tag_name, 'v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci  # Clean install from package-lock.json

      - name: Publish package to npm
        run: |
          # Uses npm trusted publishing (provenance) with OIDC authentication
          # Package.json contains publishConfig.access = "public" for @brewnode scope
          # The --provenance flag generates cryptographic proof of build origin
          # This bypasses 2FA/OTP requirements by using OIDC token verification
          npm publish --provenance --access public
