# =============================================================================
# NPM Publish on GitHub Release Workflow
# =============================================================================
# Purpose: Automatically publishes the package to npm when a GitHub Release
#          is manually published. This is the PRIMARY publishing workflow.
#
# Triggers:
#   - When you publish a GitHub Release (not just create a draft)
#   - Only for tags starting with 'v' (e.g., v2.4.0)
#
# How to use:
#   1. The 'release.yml' workflow creates a GitHub Release automatically
#   2. Go to GitHub Releases page and click "Publish release"
#   3. This workflow triggers and publishes to npm
#
# Requirements:
#   - Repository secret NPM_TOKEN must be set with valid npm auth token
#   - User must have publish rights to @brewnode/server on npm
#
# Safety: Manual control - you must click "Publish" to trigger npm publish
# =============================================================================

on:
  release:
    types: [published]  # Only when release is published, not created as draft

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Safety guard: Only run for version tags (v1.0.0, v2.4.0, etc.)
    if: startsWith(github.event.release.tag_name, 'v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org'
          always-auth: true  # Always authenticate with npm registry

      - name: Configure npm authentication
        # Creates ~/.npmrc with authentication token for npm publish
        # Requires repository secret: NPM_TOKEN (get from npmjs.com)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Writing temporary ~/.npmrc for registry authentication"
          printf "//registry.npmjs.org/:_authToken=%s\n" "${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "Verify token (npm whoami) — fails fast if token is invalid"
          npm whoami || (echo "npm whoami failed — check NPM_TOKEN and package ownership" && exit 1)

      - name: Install dependencies
        run: npm ci  # Clean install from package-lock.json

      - name: Publish package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Package.json contains publishConfig.access = "public" for @brewnode scope
          # This makes the scoped package publicly accessible on npm
          npm publish --access public
